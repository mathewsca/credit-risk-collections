[project]
name = "credit-risk-collections"
version = "1.0.0"
description = "Risco de crédito e priorização de cobrança ponta a ponta: dados sintéticos, PostgreSQL, dbt, Airflow, MLflow, FastAPI e Streamlit."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mathews Carvalho" }]
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "faker>=25",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyyaml>=6",
    "scipy>=1.12",
    "scikit-learn>=1.6",
    "lightgbm>=4.3",
    "shap>=0.46",
    "matplotlib>=3.8",
    "mlflow>=2.16",
    "pandera>=0.20",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
app = ["streamlit>=1.38", "plotly>=5.22", "requests>=2.32"]
dbt = ["dbt-core>=1.10,<1.13", "dbt-postgres>=1.9,<1.12"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD"]
ignore = ["PD011", "PD010", "E501"]  # E501: o formatter controla o tamanho das linhas de código

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
