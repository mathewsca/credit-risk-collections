# Stack local completa:  docker compose up -d --build
#   PostgreSQL :5432 | Airflow :8080 | MLflow :5000 | API :8000 | Streamlit :8501
x-project-env: &project-env
  WAREHOUSE_URL: postgresql+psycopg://${PG_USER:-analytics}:${PG_PASSWORD:-analytics}@postgres:5432/warehouse
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${PG_USER:-analytics}
  PGPASSWORD: ${PG_PASSWORD:-analytics}
  PGDATABASE: warehouse
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODEL_NAME: credit-risk-pd
  SNAPSHOT_DATE: "2025-01-31"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-analytics}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-analytics}
      POSTGRES_DB: warehouse
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-analytics} -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    build: { context: ., dockerfile: docker/mlflow.Dockerfile }
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
      --host 0.0.0.0 --port 5000 --workers 1
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    volumes:
      - mlartifacts:/mlartifacts
    ports: ["5000:5000"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  airflow:
    build: { context: ., dockerfile: docker/airflow.Dockerfile }
    command: standalone
    environment:
      <<: *project-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/pipelines/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # ambiente local de demonstração (sem login)
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-secret-change-me}
      DATA_DIR: /opt/project/data
      DBT_PROFILES_DIR: /opt/project/dbt
    volumes:
      - .:/opt/project
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { EXTRAS: api } }
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *project-env
    ports: ["8000:8000"]
    depends_on:
      mlflow: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { EXTRAS: app } }
    command: streamlit run app/Home.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      # usuário somente leitura: o dashboard não precisa (nem deve) escrever no warehouse
      WAREHOUSE_URL: postgresql+psycopg://bi_reader:bi_reader@postgres:5432/warehouse
      API_URL: http://api:8000
    volumes:
      - ./app:/srv/app
    ports: ["8501:8501"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  mlartifacts:
